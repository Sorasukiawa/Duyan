<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>渡言封面</title>
<style>
  /* 封面上只用渡言已经有的字；tools/brand.py 出图前会核对 */
  @font-face { font-family: DY; src: url("../sample/Duyan-Sample.otf") format("opentype"); }
  :root { --ink: #1D1C1A; --paper: #F4F1EA; --accent: #21505C; --muted: #6F6A60; --line: #DED8CC; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: DY; }
  .page { position: relative; width: 1280px; height: 640px; padding: 64px 80px; }
  .meta { font-size: 15px; letter-spacing: .2em; color: var(--muted); }
  h1 { font-weight: 400; font-size: 118px; line-height: 1; margin: 40px 0 0; font-kerning: normal; }
  h1 span { color: var(--accent); margin-left: .26em; }
  .lead { font-size: 36px; margin: 34px 0 0; }
  .lead-en { font-size: 26px; margin: 10px 0 0; color: var(--muted); }
  .big { position: absolute; right: 84px; top: 78px; font-size: 350px; line-height: 1; color: var(--accent); }
  .spec { position: absolute; left: 80px; right: 80px; bottom: 120px; display: flex; gap: 44px; font-size: 18px; color: var(--muted);
          border-top: 1px solid var(--line); padding-top: 22px; }
  .spec b { color: var(--accent); font-weight: 400; margin-right: .55em; }
  .sample { position: absolute; left: 80px; right: 80px; bottom: 56px; font-size: 25px; display: flex; justify-content: space-between; }
  .sample .url { color: var(--muted); font-size: 18px; align-self: flex-end; }
</style>
</head>
<body>
<div class="page">
  <div class="meta">CHINESE AND LATIN SERIF / V0.8 / 2026.10</div>
  <h1>Duyan<span>渡言</span></h1>
  <div class="lead">一字一言。</div>
  <div class="lead-en">Every stroke drawn from scratch.</div>
  <div class="big">渡</div>
  <div class="spec">
    <span><b>Han</b>Song strokes, 153 so far</span>
    <span><b>Latin</b>Bookish serif, A–Z 0–9</span>
    <span><b>Method</b>One pen, built in code</span>
    <span><b>License</b>SIL OFL 1.1</span>
  </div>
  <div class="sample"><span>山下江边，林中花草。The quick brown fox jumps over the lazy dog.</span><span class="url">github.com/Sorasukiawa/Duyan</span></div>
</div>
</body>
</html>
